<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="stylesheet" href="./global-tw.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <title>Frontend Mentor | QR code component</title>
  </head>
  <body class="bg-slate-300">
    <main class="flex h-screen">
      <div class="bg-white m-auto w-[320px] h-[499px] p-4 pb-10 rounded-[20px] shadow-black/5 shadow-md">
        <section class="text-center">
          <img src="./images/image-qr-code.png" class="w-72 h-72 rounded-[10px]"/>
          <div>
            <p class="px-4 mt-6 outfit-bold text-slate-900">
              Improve your front-end skills by building projects
            </p>
            <p class="outfit-regular mt-4 text-slate-500">
              Scan the QR code to visit Frontend Mentor and take your coding skills to the next level
            </p>
          </div>
        </section>
      </div>
    </main>
    <footer class="attribution fixed bottom-0 m-auto w-full pb-1">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
      Coded by <a href="#">Justin LeGrange</a>.
    </footer>
  </body>
</html>
